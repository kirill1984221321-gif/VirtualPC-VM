plugins {
    id 'com.android.application'
}

// Firebase/Google Services remain part of the legacy stack, but CI must also be able
// to build the new VM backend without a private google-services.json secret.
def hasGoogleServicesConfig = file('google-services.json').isFile() && file('google-services.json').length() > 2
if (hasGoogleServicesConfig) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// The standard Android debug keystore is the default for the new VM backend.
// The old Vectras/Termux:X11 signing identity is opt-in and must never be generated
// or silently substituted in CI.
def legacySigningEnabled = (providers.gradleProperty('legacySigningEnabled').orElse('false').get() == 'true')
def legacyStoreFilePath = providers.gradleProperty('legacyStoreFile').orElse(file('../vectras.jks').absolutePath).get()
def legacyStorePassword = providers.gradleProperty('legacyStorePassword').orElse(providers.environmentVariable('LEGACY_SIGNING_STORE_PASSWORD').orElse('')).get()
def legacyKeyAlias = providers.gradleProperty('legacyKeyAlias').orElse(providers.environmentVariable('LEGACY_SIGNING_KEY_ALIAS').orElse('vectras')).get()
def legacyKeyPassword = providers.gradleProperty('legacyKeyPassword').orElse(providers.environmentVariable('LEGACY_SIGNING_KEY_PASSWORD').orElse('')).get()
def legacyStoreFile = file(legacyStoreFilePath)

if (legacySigningEnabled) {
    if (!legacyStoreFile.isFile()) {
        throw new GradleException("Legacy signing was explicitly requested, but the configured keystore is missing: ${legacyStoreFile}")
    }
    if (!legacyStorePassword || !legacyKeyAlias || !legacyKeyPassword) {
        throw new GradleException('Legacy signing was explicitly requested, but legacy signing credentials are incomplete.')
    }
}

android {
    namespace 'com.vectras.vm'
    compileSdk = compileApi

    defaultConfig {
        applicationId "com.vectras.vm"
        minSdk minApi
        targetSdk targetApi
        versionCode 104
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        resValue "string", "app_version", versionName
        resValue "integer", "app_version_code", versionCode.toString()
    }

    if (legacySigningEnabled) {
        signingConfigs {
            legacy {
                storeFile legacyStoreFile
                keyAlias legacyKeyAlias
                storePassword legacyStorePassword
                keyPassword legacyKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (legacySigningEnabled) {
                signingConfig signingConfigs.legacy
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Leave the AGP-managed debug signing config untouched unless the
            // explicitly requested legacy flow is being built.
            if (legacySigningEnabled) {
                signingConfig signingConfigs.legacy
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        aidl true
        resValues = true
    }

    splits {
        abi {
            enable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildToolsVersion toolsVersion
    ndkVersion '21'

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.annotation
    implementation libs.androidx.core.ktx
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.crashlytics
    implementation libs.firebase.messaging
    implementation libs.guava
    implementation libs.gson
    implementation libs.androidx.window
    implementation libs.commons.io
    implementation libs.lottie
    implementation libs.commons.compress
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.documentfile
    compileOnly project(':shell-loader:stub')
    implementation project(':terminal-view')
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.glide
    annotationProcessor libs.compiler
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
