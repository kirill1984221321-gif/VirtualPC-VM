// Top-level build file. Legacy Vectras modules remain available, while AGP supplies Kotlin support.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.google.services
        classpath libs.firebase.crashlytics.gradle
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    toolsVersion = properties.get('TOOLS_VERSION', '36.1.0')
    compileApi = properties.get('COMPILE_API', 37)
    targetApi = properties.get('TARGET_API', 35)
    minApi = properties.get('MIN_API', 23)
}
