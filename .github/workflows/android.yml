name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - qemu-11-arm64-runtime-ui

jobs:
  build:

    runs-on: ubuntu-latest
    environment: BuildAPK

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

    - name: Send notification to Telegram
      run: |
        if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
          for chat in \
            "-d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -d message_thread_id=8" \
            "-d chat_id=${{ secrets.TELEGRAM_CHAT_ID_VEC }}"; do
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                 $chat \
                 -d $'text=New update available on GitHub repository and building APK.\nRun ID: '${GITHUB_RUN_ID}
          done
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Verify embedded QEMU assets in Debug APK
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/debug/app-debug.apk
        test -f "$APK"
        unzip -l "$APK" | grep -q 'assets/qemu/qemu-system-x86_64'
        unzip -l "$APK" | grep -q 'assets/qemu/lib/'
        unzip -l "$APK" | grep -q 'assets/qemu/share/qemu/'
        echo "Embedded QEMU assets are present in $APK"
        ls -lh "$APK"

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload to Telegram
      run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            success=true
            for file in app/build/outputs/apk/release/*.apk; do
              tries=0
              success_file=false
              until [ $tries -ge 5 ]; do
                success_targets=false
                for target in \
                  "-F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} -F message_thread_id=8" \
                  "-F chat_id=${{ secrets.TELEGRAM_CHAT_ID_VEC }}"; do
                  if curl -s -o /dev/null -F document=@"$file" $target \
                          -F $'caption=Done! Run ID: '${GITHUB_RUN_ID} \
                          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument; then
                    success_targets=true
                  fi
                done
                if $success_targets; then
                  success_file=true
                  break
                fi
                tries=$((tries+1))
              done
              if ! $success_file; then success=false; fi
            done
            if [ "$success" = false ]; then exit 1; fi
          fi
