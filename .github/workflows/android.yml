name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - qemu-11-arm64-runtime-ui

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: BuildAPK
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Set up JDK 21
      uses: actions/setup-java@v5.5.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        check-latest: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json when configured
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        set -euo pipefail
        if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          test -s app/google-services.json
          echo "google-services.json configured"
        else
          rm -f app/google-services.json
          echo "google-services.json not configured; legacy Firebase plugins will remain disabled"
        fi

    - name: Send notification to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_CHAT_ID_VEC: ${{ secrets.TELEGRAM_CHAT_ID_VEC }}
      run: |
        set -u
        if [[ -n "$TELEGRAM_BOT_TOKEN" ]]; then
          message=$'New update available on GitHub repository and building APK.\nPlease wait about 5 minutes.\nRun ID: '$GITHUB_RUN_ID
          if [[ -n "$TELEGRAM_CHAT_ID" ]]; then
            curl --fail --silent --show-error --retry 3 \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "message_thread_id=8" \
              --data-urlencode "text=${message}" || echo "Warning: Telegram notification failed for primary chat"
          fi
          if [[ -n "$TELEGRAM_CHAT_ID_VEC" ]]; then
            curl --fail --silent --show-error --retry 3 \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID_VEC}" \
              --data-urlencode "text=${message}" || echo "Warning: Telegram notification failed for Vectras chat"
          fi
        fi

    - name: Validate Gradle module directories
      shell: python
      run: |
        import pathlib
        import re

        root = pathlib.Path('.')
        settings = (root / 'settings.gradle').read_text(encoding='utf-8')
        modules = []
        for expression in re.findall(r'include\s+([^\n]+)', settings):
            modules.extend(re.findall(r"['\"]:([^'\"]+)['\"]", expression))

        missing = []
        for module in modules:
            path = root.joinpath(*module.split(':'))
            print(f'{module} -> {path}')
            if not path.is_dir():
                missing.append(f'{module} ({path})')

        if missing:
            raise SystemExit('Missing Gradle project directories:\n' + '\n'.join(missing))
        print(f'Validated {len(modules)} Gradle project directories')

    - name: Validate Gradle wrapper
      run: ./gradlew --version

    - name: Gradle configuration check
      run: ./gradlew tasks --no-daemon --stacktrace --warning-mode all

    - name: Inspect app dependencies
      run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace

    - name: Build Debug APK and legacy loader stub
      run: |
        ./gradlew :shell-loader:stub:assembleDebug assembleDebug --no-daemon --stacktrace

    - name: Assert no legacy keystore was generated
      run: |
        set -euo pipefail
        if [[ -e vectras.jks ]]; then
          echo "Unexpected vectras.jks found in CI workspace"
          exit 1
        fi
        echo "No legacy vectras.jks was generated or committed"

    - name: Run JVM unit tests
      run: ./gradlew test --no-daemon --stacktrace

    - name: Verify embedded QEMU assets in Debug APK
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/debug/app-debug.apk
        test -s "$APK"
        unzip -Z1 "$APK" | grep -Fxq 'assets/qemu/qemu-system-x86_64'
        unzip -Z1 "$APK" | grep -Eq '^assets/qemu/lib/.+'
        unzip -Z1 "$APK" | grep -Eq '^assets/qemu/share/qemu/.+'

        rm -f /tmp/qemu-system-x86_64
        unzip -p "$APK" 'assets/qemu/qemu-system-x86_64' > /tmp/qemu-system-x86_64
        test -s /tmp/qemu-system-x86_64
        readelf -h /tmp/qemu-system-x86_64 | grep -Eq 'Class:[[:space:]]+ELF64'
        readelf -h /tmp/qemu-system-x86_64 | grep -Eq 'Machine:[[:space:]]+AArch64'

        echo "Embedded ARM64 QEMU assets are present in $APK"
        ls -lh "$APK" /tmp/qemu-system-x86_64

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Verify APK outputs
      run: |
        set -euo pipefail
        test -s app/build/outputs/apk/debug/app-debug.apk
        test -s app/build/outputs/apk/release/app-release.apk
        file app/build/outputs/apk/debug/app-debug.apk
        file app/build/outputs/apk/release/app-release.apk

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload APKs to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_CHAT_ID_VEC: ${{ secrets.TELEGRAM_CHAT_ID_VEC }}
      run: |
        set -u
        if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
          exit 0
        fi

        upload() {
          local file="$1"
          local chat_id="$2"
          local thread_id="${3:-}"
          local args=(
            --fail --silent --show-error --retry 5 --retry-delay 2
            -F "chat_id=${chat_id}"
            -F "document=@${file}"
            -F "caption=Done! This is an automatically built development version.\nRun ID: ${GITHUB_RUN_ID}"
          )
          if [[ -n "$thread_id" ]]; then
            args+=( -F "message_thread_id=${thread_id}" )
          fi
          curl "${args[@]}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
        }

        failed=0
        for file in app/build/outputs/apk/release/*.apk; do
          echo "Uploading $(basename "$file")"
          if [[ -n "$TELEGRAM_CHAT_ID" ]]; then
            if ! upload "$file" "$TELEGRAM_CHAT_ID" 8; then
              echo "Warning: upload failed for primary Telegram chat"
              failed=1
            fi
          fi
          if [[ -n "$TELEGRAM_CHAT_ID_VEC" ]]; then
            if ! upload "$file" "$TELEGRAM_CHAT_ID_VEC"; then
              echo "Warning: upload failed for Vectras Telegram chat"
              failed=1
            fi
          fi
        done

        if [[ "$failed" -ne 0 ]]; then
          echo "APK build succeeded, but at least one Telegram upload failed."
        fi
