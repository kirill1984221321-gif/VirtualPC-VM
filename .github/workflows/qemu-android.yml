name: Native QEMU Android

on:
  push:
    branches: [qemu-rebuild]
    paths:
      - 'qemu/**'
      - '.github/workflows/qemu-android.yml'
  pull_request:
    branches: [qemu-rebuild]
    paths:
      - 'qemu/**'
      - '.github/workflows/qemu-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qemu-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-35" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            gcc \
            g++ \
            make \
            flex \
            bison

      - name: Verify NDK
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build QEMU for Android ARM64
        run: |
          chmod +x qemu/scripts/build-android.sh
          qemu/scripts/build-android.sh

      - name: Verify QEMU artifact contents
        run: |
          test -x qemu/output/stage/qemu-system-x86_64/bin/qemu-system-x86_64
          file qemu/output/stage/qemu-system-x86_64/bin/qemu-system-x86_64
          readelf -h qemu/output/stage/qemu-system-x86_64/bin/qemu-system-x86_64 | grep -E 'Class:|Machine:'
          readelf -d qemu/output/stage/qemu-system-x86_64/bin/qemu-system-x86_64 || true

      - name: Package QEMU runtime
        run: |
          tar -C qemu/output/stage -czf qemu-android-arm64-v8a-x86_64-softmmu.tar.gz qemu-system-x86_64

      - name: Upload QEMU runtime
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-arm64-v8a-x86_64-softmmu
          path: qemu-android-arm64-v8a-x86_64-softmmu.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-build-diagnostics
          path: |
            qemu/output/build/**/meson-logs/**
            qemu/output/build/**/config-host.mak
          if-no-files-found: ignore
          retention-days: 7
